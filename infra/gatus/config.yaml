# Gatus - status page cho homelab (config-as-code, mount vao /config/config.yaml)
storage:
  type: memory

alerting:
  slack:
    webhook-url: "${SLACK_WEBHOOK_URL}"
    default-alert:
      enabled: true
      description: "homelab health"
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
  - name: hello
    group: apps
    url: "https://hello.phucnn.io.vn/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - '[BODY] == pat(*"status":"ok"*)'
    alerts:
      - type: slack

  - name: site
    group: apps
    url: "https://phucnn.io.vn/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*Bechovang*)"
    alerts:
      - type: slack

  - name: cloudflare-edge
    group: infra
    url: "https://www.phucnn.io.vn/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: slack

  - name: storagehub
    group: apps
    url: "https://storagehub.phucnn.io.vn/actuator/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - '[BODY] == pat(*"status":"UP"*)'
    alerts:
      - type: slack

  - name: dokploy-postgres
    group: infra
    url: "tcp://dokploy-postgres:5432"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: slack

  - name: dokploy-api
    group: infra
    url: "http://dokploy:3000/api/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: slack
